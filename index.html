<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Messenger</title>
    <meta name="theme-color" content="#0d0221">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030007;
            color: #f3e8ff;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            background-color: #0d0221;
        }

        .bg-cosmic {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at center, #2e1065 0%, #170338 50%, #030007 100%);
            z-index: 0;
            pointer-events: none;
        }

        @media (min-width: 768px) {
            .app-container {
                max-width: 450px;
                height: 85vh;
                min-height: auto;
                border-radius: 24px;
                box-shadow: 0 0 40px rgba(168, 85, 247, 0.3), 0 20px 40px rgba(0, 0, 0, 0.9);
                border: 1px solid rgba(168, 85, 247, 0.4);
                overflow: hidden;
            }
        }

        #toastContainer {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
            pointer-events: none;
        }

        .toast-msg {
            background: rgba(23, 3, 56, 0.95);
            border: 1px solid #c084fc;
            box-shadow: 0 4px 20px rgba(192, 132, 252, 0.4);
            padding: 12px 16px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            animation: slideDown 0.3s ease, fadeOut 0.3s ease 3.2s forwards;
            cursor: pointer;
        }

        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-10px); }
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 65px);
            display: none;
            flex-direction: column;
            background: rgba(13, 2, 33, 0.7);
            z-index: 5;
        }

        .screen.active {
            display: flex;
        }

        #authScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d0221;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 24px;
            z-index: 30;
            text-align: center;
            overflow-y: auto;
        }

        #authScreen h2 {
            margin-bottom: 8px;
            color: #e879f9;
            text-shadow: 0 0 15px rgba(232, 121, 249, 0.6);
        }

        #authScreen p {
            color: #d8b4fe;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .auth-inputs {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        #authScreen input, .settings-card input, #searchInput, .modal-box input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(168, 85, 247, 0.5);
            background: rgba(46, 16, 101, 0.4);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        #authScreen button, #saveProfileBtn, #switchAccountBtn, #registerBtn, .modal-box button {
            width: 100%;
            max-width: 320px;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #a855f7, #6b21a8);
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        .accounts-list {
            width: 100%;
            max-width: 320px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 160px;
            overflow-y: auto;
        }

        .account-card {
            background: rgba(46, 16, 101, 0.5);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .account-info { text-align: left; }
        .account-info h4 { font-size: 0.9rem; color: #f3e8ff; }
        .account-info p { font-size: 0.75rem; color: #d8b4fe; margin: 0; }

        .header {
            padding: 14px 20px;
            background: rgba(23, 3, 56, 0.85);
            border-bottom: 1px solid rgba(168, 85, 247, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            flex-shrink: 0;
            color: #e879f9;
        }

        .nav-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: rgba(23, 3, 56, 0.9);
            border-top: 1px solid rgba(168, 85, 247, 0.3);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .nav-item {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            flex: 1;
        }

        .nav-item.active {
            color: #e879f9;
            text-shadow: 0 0 10px rgba(232, 121, 249, 0.6);
        }

        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

        .list-container {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .list-item {
            background: rgba(46, 16, 101, 0.35);
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(168, 85, 247, 0.25);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .item-info h4 { font-size: 0.95rem; margin-bottom: 2px; color: #f3e8ff; }
        .item-info p { font-size: 0.8rem; color: #d8b4fe; }

        #chatRoomScreen { z-index: 6; background: transparent; }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            word-break: break-word;
            background: rgba(46, 16, 101, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.3);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: #f3e8ff;
        }

        .msg-bubble.outgoing {
            background: linear-gradient(135deg, #9333ea, #6b21a8);
            color: #fff;
            align-self: flex-end;
            border: 1px solid rgba(216, 180, 254, 0.4);
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 4px;
        }

        /* ВИДЕО-КРУЖКИ */
        .video-circle-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            margin: 4px 0;
        }
        .video-circle-wrapper.outgoing {
            align-self: flex-end;
            align-items: flex-end;
        }
        .video-circle-wrapper.incoming {
            align-self: flex-start;
            align-items: flex-start;
        }

        .video-circle-box {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #c084fc;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.5);
            background: #000;
            position: relative;
            cursor: pointer;
        }

        .video-circle-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .video-circle-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.25);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-circle-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 200px;
            padding: 4px 12px;
            margin-top: 4px;
            font-size: 0.75rem;
            color: #d8b4fe;
        }

        /* ГОЛОСОВЫЕ СООБЩЕНИЯ */
        .voice-msg-capsule {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 18px;
            max-width: 82%;
            color: #fff;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.3);
            margin: 4px 0;
        }
        .voice-msg-capsule.outgoing {
            background: linear-gradient(135deg, #9333ea, #6b21a8);
            border: 1px solid rgba(216, 180, 254, 0.4);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .voice-msg-capsule.incoming {
            background: rgba(46, 16, 101, 0.75);
            border: 1px solid rgba(168, 85, 247, 0.4);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .voice-play-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff;
            border: none;
            color: #7e22ce;
            font-size: 1.1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .voice-info-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 140px;
        }

        .voice-waves-row {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 20px;
        }

        .voice-wave-line {
            width: 3px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 2px;
        }

        .voice-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.85);
        }

        .chat-input-panel {
            padding: 10px 14px;
            background: rgba(23, 3, 56, 0.95);
            border-top: 1px solid rgba(168, 85, 247, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .chat-input-panel input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 22px;
            border: 1px solid rgba(168, 85, 247, 0.4);
            background: rgba(76, 29, 149, 0.25);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .chat-input-panel input::placeholder {
            color: #d8b4fe;
            opacity: 0.7;
        }

        .input-icon-btn {
            background: none;
            border: none;
            color: #e879f9;
            cursor: pointer;
            font-size: 1.3rem;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .purple-send-btn {
            background: linear-gradient(135deg, #a855f7, #6b21a8);
            border: none;
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.5);
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .action-btn {
            background: none;
            border: none;
            color: #e879f9;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 6px;
        }

        .settings-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .settings-card {
            background: rgba(46, 16, 101, 0.35);
            border: 1px solid rgba(168, 85, 247, 0.25);
            padding: 16px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .settings-card label { font-size: 0.85rem; color: #d8b4fe; }

        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 0, 7, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 40;
        }
        .modal-box {
            background: #170338;
            border: 1px solid rgba(168, 85, 247, 0.5);
            padding: 24px;
            border-radius: 20px;
            width: 85%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: center;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }

        #videoPlayerModal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 0, 7, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 50;
            flex-direction: column;
            gap: 20px;
        }
        #fullscreenCircleVideo {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #c084fc;
            box-shadow: 0 0 40px rgba(192, 132, 252, 0.6);
            background: #000;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="bg-cosmic"></div>
        
        <div id="toastContainer"></div>

        <!-- ЭКРАН АВТОРИЗАЦИИ -->
        <div id="authScreen">
            <h2>Cosmic Messenger</h2>
            <p>Фиолетовый защищенный мессенджер</p>
            <div class="auth-inputs">
                <input type="text" id="regName" placeholder="Ваше имя..." autocomplete="off">
                <input type="text" id="regUsername" placeholder="Юзернейм (например, @alex)" autocomplete="off">
                <input type="text" id="regPhone" placeholder="Номер телефона" autocomplete="off">
                <input type="password" id="regPassword" placeholder="Секретный пин-код/пароль" autocomplete="new-password">
            </div>
            <button id="registerBtn" type="button">Создать и войти</button>
            
            <div id="savedAccountsSection" style="width: 100%; display: flex; flex-direction: column; align-items: center; display: none;">
                <p style="margin: 16px 0 6px 0; font-size: 0.8rem; color: #d8b4fe;">Сохраненные профили:</p>
                <div class="accounts-list" id="accountsListContainer"></div>
            </div>
        </div>

        <!-- ВКЛАДКА 1: ЧАТЫ -->
        <div id="chatsScreen" class="screen active">
            <div class="header">
                <span>Чаты и группы</span>
                <button class="action-btn" id="openGroupModalBtn" title="Создать группу">➕</button>
            </div>
            <div class="list-container" id="chatsList">
                <div class="list-item" style="cursor: default; background: transparent; border: none; justify-content: center; color: #d8b4fe; text-align: center;">
                    Список чатов пуст. Воспользуйтесь поиском.
                </div>
            </div>
        </div>

        <!-- ВКЛАДКА 2: ПОИСК -->
        <div id="searchScreen" class="screen">
            <div class="header"><span>Поиск людей и групп</span></div>
            <div style="padding: 12px; flex-shrink: 0;">
                <input type="text" id="searchInput" placeholder="Имя, @username или номер..." autocomplete="off">
            </div>
            <div class="list-container" id="searchResults"></div>
        </div>

        <!-- ВКЛАДКА 3: ПРОФИЛЬ -->
        <div id="profileScreen" class="screen">
            <div class="header"><span>Мой профиль</span></div>
            <div class="settings-content">
                <div class="settings-card">
                    <label>Ваше имя</label>
                    <input type="text" id="editName">
                </div>
                <div class="settings-card">
                    <label>Юзернейм</label>
                    <input type="text" id="editUsername" readonly style="background: rgba(23,3,56,0.6); color:#9ca3af;">
                </div>
                <div class="settings-card">
                    <label>Номер телефона</label>
                    <input type="text" id="editPhone" readonly style="background: rgba(23,3,56,0.6); color:#9ca3af;">
                </div>
                <button id="saveProfileBtn">Сохранить</button>
                <button id="switchAccountBtn" style="background: rgba(76, 29, 149, 0.4); border: 1px solid rgba(168,85,247,0.4);">Сменить аккаунт</button>
            </div>
        </div>

        <!-- ЭКРАН ЧАТА -->
        <div id="chatRoomScreen" class="screen">
            <div class="header">
                <button class="action-btn" id="closeChatBtn">⬅</button>
                <span id="activeChatTitle" style="color: #e879f9;">Чат</span>
                <span></span>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            
            <div class="chat-input-panel">
                <!-- СКРЕПКА ДЛЯ ФАЙЛОВ -->
                <label for="fileInput" class="input-icon-btn" title="Прикрепить файл" style="cursor: pointer;">📎</label>
                <input type="file" id="fileInput" style="display: none;" multiple>

                <input type="text" id="msgInput" placeholder="Сообщение" autocomplete="off">
                
                <!-- КАМЕРА ДЛЯ ВИДЕО-КРУЖКОВ -->
                <button class="input-icon-btn" id="videoBtn" title="Записать видео-кружок">📹</button>
                <!-- МИКРОФОН ДЛЯ ГОЛОСОВЫХ -->
                <button class="input-icon-btn" id="voiceBtn" title="Записать голосовое сообщение">🎤</button>
                
                <button class="purple-send-btn" id="sendMsgBtn" title="Отправить">➤</button>
            </div>
        </div>

        <!-- НАВИГАЦИЯ -->
        <div class="nav-bar">
            <button class="nav-item active" data-target="chatsScreen">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                Чаты
            </button>
            <button class="nav-item" data-target="searchScreen">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                Поиск
            </button>
            <button class="nav-item" data-target="profileScreen">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                Профиль
            </button>
        </div>

        <!-- МОДАЛКИ -->
        <div class="modal" id="groupModal">
            <div class="modal-box">
                <h3 style="color: #e879f9;">Создать группу</h3>
                <input type="text" id="groupNameInput" placeholder="Название группы..." autocomplete="off">
                <button id="createGroupConfirmBtn">Создать</button>
                <button id="closeGroupModalBtn" style="background:none; box-shadow:none; color:#d8b4fe;">Отмена</button>
            </div>
        </div>

        <div class="modal" id="passwordModal">
            <div class="modal-box">
                <h3 style="color: #e879f9;">Защита профиля</h3>
                <p style="font-size: 0.85rem; color: #d8b4fe;" id="passwordPromptText">Введите пароль</p>
                <input type="password" id="loginPasswordInput" placeholder="Пароль..." autocomplete="current-password">
                <button id="confirmLoginBtn">Войти</button>
                <button id="cancelLoginBtn" style="background:none; box-shadow:none; color:#d8b4fe;">Отмена</button>
            </div>
        </div>

        <div class="modal" id="mediaModal">
            <div class="modal-box">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 id="mediaModalTitle" style="color: #e879f9; font-size: 1.1rem;">Запись</h3>
                    <button id="flipCameraBtn" title="Перевернуть камеру" style="display: none; background: rgba(168,85,247,0.3); border: 1px solid #c084fc; width: 36px; height: 36px; border-radius: 50%; font-size: 1rem; cursor: pointer; padding:0; box-shadow:none;">🔄</button>
                </div>
                <div style="display:flex; justify-content:center; align-items:center; margin: 6px 0;">
                    <video id="mediaPreviewVideo" autoplay muted playsinline style="width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 3px solid #c084fc; display:none;"></video>
                </div>
                <p id="recordingTimer" style="font-size: 1.2rem; color: #f472b6; font-weight: bold;">00:00</p>
                <button id="stopAndSendMediaBtn" style="background: #9333ea; box-shadow: 0 4px 15px rgba(147, 51, 234, 0.6);">Остановить и отправить</button>
                <button id="cancelMediaBtn" style="background:none; box-shadow:none; color:#d8b4fe;">Отмена</button>
            </div>
        </div>

        <div id="videoPlayerModal">
            <video id="fullscreenCircleVideo" playsinline controls autoplay></video>
            <button id="closeVideoPlayerBtn" style="width: auto; padding: 10px 24px; border-radius: 14px; background: rgba(168, 85, 247, 0.4); border: 1px solid #c084fc; color: #fff; cursor: pointer;">Закрыть</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD076TRQB2Rg1HBGyykBVXRvn7Vw2N8zbY",
            authDomain: "geminichat-58c72.firebaseapp.com",
            databaseURL: "https://geminichat-58c72-default-rtdb.firebaseio.com",
            projectId: "geminichat-58c72",
            storageBucket: "geminichat-58c72.firebasestorage.app",
            messagingSenderId: "815197982634",
            appId: "1:815197982634:web:3b9c01f83675f74e46e5d3",
            measurementId: "G-845NCYG8CL"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myName = localStorage.getItem('g_current_name');
        let myUsername = localStorage.getItem('g_current_username');
        let myPhone = localStorage.getItem('g_current_phone');
        let currentChatId = null;
        let messageListener = null;
        let userChatsListener = null;

        function cleanKey(str) {
            if (!str) return 'unknown';
            return str.replace(/[@.#$\/\[\]]/g, '_').toLowerCase();
        }

        const authScreen = document.getElementById('authScreen');

        if (myName && myUsername) {
            authScreen.style.display = 'none';
            db.ref('users/' + cleanKey(myUsername)).set({
                name: myName,
                username: myUsername,
                phone: myPhone || ''
            });
            loadUserChats();
            initGlobalNotifications();
        } else {
            authScreen.style.display = 'flex';
            renderSavedAccounts();
        }

        function showInAppNotification(senderName, textPreview) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerHTML = `
                <span style="font-size: 1.5rem;">💬</span>
                <div style="flex:1; overflow:hidden;">
                    <h5 style="color: #e879f9; font-size: 0.9rem; margin-bottom: 2px;">${senderName}</h5>
                    <p style="color: #f3e8ff; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin:0;">${textPreview}</p>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        function initGlobalNotifications() {
            const userKey = cleanKey(myUsername);
            db.ref(`user_chats/${userKey}`).once('value', (snapshot) => {
                const chats = snapshot.val();
                if (!chats) return;

                Object.keys(chats).forEach(chatId => {
                    db.ref(`chats/${chatId}/messages`).limitToLast(1).on('child_added', (msgSnap) => {
                        const msg = msgSnap.val();
                        if (msg && msg.username !== myUsername && (Date.now() - msg.timestamp < 10000)) {
                            if (currentChatId !== chatId) {
                                let previewText = msg.text || (msg.type === 'video' ? '📹 Видео-кружок' : (msg.type === 'voice' ? '🎤 Голосовое сообщение' : (msg.type === 'file' ? '📁 Файл' : 'Медиа файл')));
                                showInAppNotification(msg.sender || 'Новое сообщение', previewText);
                            }
                        }
                    });
                });
            });
        }

        function renderSavedAccounts() {
            const container = document.getElementById('accountsListContainer');
            const section = document.getElementById('savedAccountsSection');
            container.innerHTML = '';

            let profiles = JSON.parse(localStorage.getItem('g_saved_profiles') || '[]');
            if (profiles.length === 0) {
                section.style.display = 'none';
                return;
            }
            section.style.display = 'flex';

            profiles.forEach(acc => {
                const card = document.createElement('div');
                card.classList.add('account-card');
                card.innerHTML = `
                    <div class="account-info">
                        <h4>🔒 ${acc.name} (${acc.username})</h4>
                        <p>${acc.phone || 'Нет номера'}</p>
                    </div>
                    <span style="color: #e879f9; font-size: 1.2rem;">➜</span>
                `;
                card.onclick = () => openPasswordCheckModal(acc);
                container.appendChild(card);
            });
        }

        function openPasswordCheckModal(acc) {
            const modal = document.getElementById('passwordModal');
            const input = document.getElementById('loginPasswordInput');
            const promptText = document.getElementById('passwordPromptText');
            
            input.value = '';
            promptText.textContent = `Пароль для ${acc.username}`;
            modal.style.display = 'flex';
            input.focus();

            document.getElementById('confirmLoginBtn').onclick = function() {
                if (input.value === acc.password) {
                    localStorage.setItem('g_current_name', acc.name);
                    localStorage.setItem('g_current_username', acc.username);
                    localStorage.setItem('g_current_phone', acc.phone || '');
                    modal.style.display = 'none';
                    location.reload();
                } else {
                    alert('Неверный пароль!');
                }
            };
            document.getElementById('cancelLoginBtn').onclick = () => modal.style.display = 'none';
        }

        document.getElementById('registerBtn').addEventListener('click', function() {
            const name = document.getElementById('regName').value.trim();
            let uname = document.getElementById('regUsername').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            
            if (!name || !uname || !password) {
                alert('Заполните Имя, Юзернейм и Пароль!');
                return;
            }

            if (!uname.startsWith('@')) uname = '@' + uname;

            localStorage.setItem('g_current_name', name);
            localStorage.setItem('g_current_username', uname);
            localStorage.setItem('g_current_phone', phone);
            
            let profiles = JSON.parse(localStorage.getItem('g_saved_profiles') || '[]');
            const idx = profiles.findIndex(p => p.username === uname);
            if (idx !== -1) profiles[idx] = { name, username: uname, phone, password };
            else profiles.push({ name, username: uname, phone, password });
            localStorage.setItem('g_saved_profiles', JSON.stringify(profiles));

            db.ref('users/' + cleanKey(uname)).set({ name, username: uname, phone });

            location.reload();
        });

        document.getElementById('switchAccountBtn').addEventListener('click', () => {
            localStorage.removeItem('g_current_name');
            localStorage.removeItem('g_current_username');
            localStorage.removeItem('g_current_phone');
            location.reload();
        });

        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                
                btn.classList.add('active');
                const target = btn.getAttribute('data-target');
                document.getElementById(target).classList.add('active');

                if (target === 'profileScreen') {
                    document.getElementById('editName').value = myName || '';
                    document.getElementById('editUsername').value = myUsername || '';
                    document.getElementById('editPhone').value = myPhone || '';
                } else if (target === 'chatsScreen') {
                    loadUserChats();
                }
            });
        });

        document.getElementById('saveProfileBtn').addEventListener('click', () => {
            const newName = document.getElementById('editName').value.trim();
            if (!newName) return;
            localStorage.setItem('g_current_name', newName);
            myName = newName;
            db.ref('users/' + cleanKey(myUsername)).update({ name: newName });
            alert('Профиль сохранен!');
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.trim().toLowerCase();
            const resultsBox = document.getElementById('searchResults');
            resultsBox.innerHTML = '';
            if (!query) return;

            db.ref('users').once('value', (snapshot) => {
                const users = snapshot.val() || {};
                db.ref('groups').once('value', (gSnapshot) => {
                    const groups = gSnapshot.val() || {};
                    resultsBox.innerHTML = '';
                    let found = false;

                    Object.values(users).forEach(user => {
                        if (!user.username || user.username === myUsername) return;
                        if ((user.name && user.name.toLowerCase().includes(query)) || user.username.toLowerCase().includes(query)) {
                            found = true;
                            const div = document.createElement('div');
                            div.classList.add('list-item');
                            div.innerHTML = `<div class="item-info"><h4>👤 ${user.name}</h4><p>${user.username}</p></div>`;
                            div.addEventListener('click', () => openPersonalChat(user));
                            resultsBox.appendChild(div);
                        }
                    });

                    Object.keys(groups).forEach(gId => {
                        const group = groups[gId];
                        if (group.name && group.name.toLowerCase().includes(query)) {
                            found = true;
                            const div = document.createElement('div');
                            div.classList.add('list-item');
                            div.innerHTML = `<div class="item-info"><h4>👥 Группа: ${group.name}</h4><p>Нажмите для вступления</p></div>`;
                            div.addEventListener('click', () => joinGroupChat(gId, group.name));
                            resultsBox.appendChild(div);
                        }
                    });

                    if (!found) {
                        resultsBox.innerHTML = '<div style="padding: 15px; color: #d8b4fe; text-align: center;">Ничего не найдено</div>';
                    }
                });
            });
        });

        function openPersonalChat(user) {
            const sorted = [myUsername, user.username].sort();
            currentChatId = 'chat_' + cleanKey(sorted[0]) + '_' + cleanKey(sorted[1]);
            
            db.ref(`user_chats/${cleanKey(myUsername)}/${currentChatId}`).set({ title: user.name || 'Собеседник', type: 'private', id: currentChatId });
            db.ref(`user_chats/${cleanKey(user.username)}/${currentChatId}`).set({ title: myName || 'Собеседник', type: 'private', id: currentChatId });

            document.getElementById('activeChatTitle').textContent = user.name || 'Чат';
            switchScreen('chatRoomScreen');
            loadMessages();
        }

        function joinGroupChat(gId, gName) {
            currentChatId = gId;
            db.ref(`user_chats/${cleanKey(myUsername)}/${gId}`).set({ title: 'Группа: ' + gName, type: 'group', id: gId });
            document.getElementById('activeChatTitle').textContent = '👥 ' + gName;
            switchScreen('chatRoomScreen');
            loadMessages();
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function loadUserChats() {
            const chatsList = document.getElementById('chatsList');
            const userKey = cleanKey(myUsername);

            if (userChatsListener) {
                db.ref(`user_chats/${userKey}`).off('value', userChatsListener);
            }

            userChatsListener = db.ref(`user_chats/${userKey}`).on('value', (snapshot) => {
                chatsList.innerHTML = '';
                const chats = snapshot.val();
                if (!chats) {
                    chatsList.innerHTML = '<div style="color: #d8b4fe; text-align: center; margin-top: 20px;">Список чатов пуст. Воспользуйтесь поиском.</div>';
                    return;
                }

                Object.values(chats).forEach(chat => {
                    const div = document.createElement('div');
                    div.classList.add('list-item');
                    div.innerHTML = `<div class="item-info"><h4>💬 ${chat.title}</h4><p>Открыть переписку</p></div>`;
                    div.addEventListener('click', () => {
                        currentChatId = chat.id;
                        document.getElementById('activeChatTitle').textContent = chat.title;
                        switchScreen('chatRoomScreen');
                        loadMessages();
                    });
                    chatsList.appendChild(div);
                });
            });
        }

        document.getElementById('sendMsgBtn').addEventListener('click', sendMessage);
        document.getElementById('msgInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function sendMessage() {
            const textInput = document.getElementById('msgInput');
            const text = textInput.value.trim();
            if (!text || !currentChatId) return;

            db.ref('chats/' + currentChatId + '/messages').push({
                sender: myName,
                username: myUsername,
                text: text,
                type: 'text',
                timestamp: Date.now()
            });
            textInput.value = '';
        }

        // ОБРАБОТКА И ОТПРАВКА ФАЙЛОВ ЧЕРЕЗ СКРЕПКУ С ПОДДЕРЖКОЙ ОТКРЫТИЯ/СКАЧИВАНИЯ
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = e.target.files;
            if (!files.length || !currentChatId) return;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const fileSizeKB = Math.round(file.size / 1024);
                
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onloadend = function() {
                    db.ref('chats/' + currentChatId + '/messages').push({
                        sender: myName,
                        username: myUsername,
                        fileName: file.name,
                        fileSize: fileSizeKB > 1024 ? (fileSizeKB / 1024).toFixed(1) + ' MB' : fileSizeKB + ' KB',
                        mediaUrl: reader.result,
                        type: 'file',
                        timestamp: Date.now()
                    });
                };
            }
            e.target.value = '';
        });

        // ЗАПИСЬ ВИДЕО И ГОЛОСОВЫХ С НАДЕЖНЫМ КОДИРОВАНИЕМ
        let mediaStream = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let mediaTimerInterval = null;
        let secondsElapsed = 0;
        let currentMediaType = 'voice';
        let currentFacingMode = 'user'; 

        document.getElementById('voiceBtn').addEventListener('click', async () => {
            currentMediaType = 'voice';
            document.getElementById('mediaModalTitle').textContent = 'Запись голосового';
            document.getElementById('flipCameraBtn').style.display = 'none';
            await startRecording();
        });

        document.getElementById('videoBtn').addEventListener('click', async () => {
            currentMediaType = 'video';
            document.getElementById('mediaModalTitle').textContent = 'Видео-кружок';
            document.getElementById('flipCameraBtn').style.display = 'flex';
            await startRecording();
        });

        document.getElementById('flipCameraBtn').addEventListener('click', async () => {
            if (currentMediaType !== 'video') return;
            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
            await startRecording();
        });

        async function startRecording() {
            const modal = document.getElementById('mediaModal');
            const videoElem = document.getElementById('mediaPreviewVideo');
            const timerElem = document.getElementById('recordingTimer');
            
            modal.style.display = 'flex';
            secondsElapsed = 0;
            timerElem.textContent = "00:00";
            audioChunks = [];

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            try {
                let constraints = {
                    audio: true,
                    video: (currentMediaType === 'video') ? { width: 320, height: 320, facingMode: currentFacingMode } : false
                };

                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);

                if (currentMediaType === 'video') {
                    videoElem.srcObject = mediaStream;
                    videoElem.style.display = 'block';
                } else {
                    videoElem.style.display = 'none';
                }

                let options = { mimeType: currentMediaType === 'video' ? 'video/webm;codecs=vp8,opus' : 'audio/webm' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: currentMediaType === 'video' ? 'video/webm' : 'audio/ogg' };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options = {};
                    }
                }

                mediaRecorder = new MediaRecorder(mediaStream, options);
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.start();

                clearInterval(mediaTimerInterval);
                mediaTimerInterval = setInterval(() => {
                    secondsElapsed++;
                    let mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                    let secs = (secondsElapsed % 60).toString().padStart(2, '0');
                    timerElem.textContent = `${mins}:${secs}`;
                }, 1000);

            } catch (err) {
                alert('Ошибка доступа к микрофону или камере!');
                modal.style.display = 'none';
            }
        }

        document.getElementById('stopAndSendMediaBtn').onclick = function() {
            clearInterval(mediaTimerInterval);
            document.getElementById('mediaModal').style.display = 'none';

            if (!mediaRecorder || mediaRecorder.state === 'inactive') return;

            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: currentMediaType === 'video' ? 'video/webm' : 'audio/webm' });
                
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = function() {
                    const base64data = reader.result;

                    db.ref('chats/' + currentChatId + '/messages').push({
                        sender: myName,
                        username: myUsername,
                        mediaUrl: base64data,
                        type: currentMediaType,
                        timestamp: Date.now()
                    });
                };

                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                }
            };

            mediaRecorder.stop();
        };

        document.getElementById('cancelMediaBtn').onclick = function() {
            clearInterval(mediaTimerInterval);
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('mediaModal').style.display = 'none';
        };

        const videoPlayerModal = document.getElementById('videoPlayerModal');
        const fullscreenCircleVideo = document.getElementById('fullscreenCircleVideo');
        document.getElementById('closeVideoPlayerBtn').onclick = () => {
            fullscreenCircleVideo.pause();
            videoPlayerModal.style.display = 'none';
        };

        function formatTime(timestamp) {
            const date = new Date(timestamp || Date.now());
            return date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
        }

        function loadMessages() {
            const box = document.getElementById('chatMessages');
            box.innerHTML = '';

            if (messageListener) {
                db.ref('chats/' + currentChatId + '/messages').off('value', messageListener);
            }

            messageListener = db.ref('chats/' + currentChatId + '/messages').on('value', (snapshot) => {
                box.innerHTML = '';
                const data = snapshot.val();

                if (!data) {
                    box.innerHTML = '<div style="color: #d8b4fe; text-align: center; margin-top: 20px;">Нет сообщений. Напишите первыми!</div>';
                    return;
                }

                Object.values(data).forEach(msg => {
                    const isOutgoing = (msg.username === myUsername);
                    const timeStr = formatTime(msg.timestamp);

                    if (msg.type === 'video') {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'video-circle-wrapper ' + (isOutgoing ? 'outgoing' : 'incoming');

                        const boxElem = document.createElement('div');
                        boxElem.className = 'video-circle-box';

                        const video = document.createElement('video');
                        video.src = msg.mediaUrl;
                        video.playsInline = true;
                        video.muted = true;
                        video.preload = "metadata";

                        const overlay = document.createElement('div');
                        overlay.className = 'video-circle-overlay';
                        overlay.innerHTML = '<span style="font-size: 1.8rem; color: #fff; opacity: 0.85;">▶</span>';

                        boxElem.appendChild(video);
                        boxElem.appendChild(overlay);

                        boxElem.onclick = () => {
                            fullscreenCircleVideo.src = msg.mediaUrl;
                            videoPlayerModal.style.display = 'flex';
                            fullscreenCircleVideo.play().catch(e => console.log(e));
                        };

                        const footer = document.createElement('div');
                        footer.className = 'video-circle-footer';
                        footer.innerHTML = `
                            <span>Видео</span>
                            <div class="video-meta-right">
                                <span>${timeStr}</span>
                                <span style="color: #c084fc; font-weight: bold;">✓✓</span>
                            </div>
                        `;

                        wrapper.appendChild(boxElem);
                        wrapper.appendChild(footer);
                        box.appendChild(wrapper);

                    } else if (msg.type === 'voice') {
                        const capsule = document.createElement('div');
                        capsule.className = 'voice-msg-capsule ' + (isOutgoing ? 'outgoing' : 'incoming');

                        const playBtn = document.createElement('button');
                        playBtn.className = 'voice-play-btn';
                        playBtn.innerHTML = '▶';

                        const infoCol = document.createElement('div');
                        infoCol.className = 'voice-info-col';

                        const wavesRow = document.createElement('div');
                        wavesRow.className = 'voice-waves-row';
                        for (let i = 0; i < 20; i++) {
                            const line = document.createElement('div');
                            line.className = 'voice-wave-line';
                            line.style.height = (Math.sin(i * 0.7) * 7 + 12) + 'px';
                            wavesRow.appendChild(line);
                        }

                        const footerRow = document.createElement('div');
                        footerRow.className = 'voice-footer-row';
                        footerRow.innerHTML = `
                            <span>Голосовое</span>
                            <div>
                                <span>${timeStr}</span>
                                <span style="font-weight: bold; margin-left: 2px;">✓✓</span>
                            </div>
                        `;

                        infoCol.appendChild(wavesRow);
                        infoCol.appendChild(footerRow);

                        capsule.appendChild(playBtn);
                        capsule.appendChild(infoCol);

                        const audioElement = new Audio(msg.mediaUrl);
                        
                        playBtn.onclick = () => {
                            if (audioElement.paused) {
                                audioElement.play().then(() => {
                                    playBtn.innerHTML = '⏸';
                                }).catch(err => {
                                    alert('Не удалось воспроизвести аудио');
                                    console.error(err);
                                });
                            } else {
                                audioElement.pause();
                                playBtn.innerHTML = '▶';
                            }
                        };

                        audioElement.onended = () => {
                            playBtn.innerHTML = '▶';
                        };

                        box.appendChild(capsule);

                    } else if (msg.type === 'file') {
                        const div = document.createElement('div');
                        div.classList.add('msg-bubble');
                        if (isOutgoing) div.classList.add('outgoing');
                        
                        const fileName = msg.fileName || 'Файл';
                        const fileSize = msg.fileSize || '';

                        div.innerHTML = `
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span style="font-size: 1.8rem;">📎</span>
                                <div style="flex: 1; overflow: hidden;">
                                    <div style="font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${fileName}</div>
                                    <div style="font-size: 0.75rem; color: #d8b4fe;">${fileSize}</div>
                                </div>
                            </div>
                            <div style="margin-top: 8px; display: flex; gap: 10px;">
                                <button class="file-action-download" style="flex: 1; background: rgba(168,85,247,0.3); border: 1px solid #c084fc; color: #fff; padding: 6px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;">Скачать</button>
                            </div>
                            <div style="text-align: right; font-size: 0.7rem; color: #d8b4fe; margin-top: 4px;">${timeStr}</div>
                        `;

                        div.querySelector('.file-action-download').onclick = () => {
                            const a = document.createElement('a');
                            a.href = msg.mediaUrl;
                            a.download = fileName;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                        };

                        box.appendChild(div);

                    } else {
                        const div = document.createElement('div');
                        div.classList.add('msg-bubble');
                        if (isOutgoing) div.classList.add('outgoing');
                        div.innerHTML = `<div>${msg.text}</div><div style="text-align: right; font-size: 0.7rem; color: #d8b4fe; margin-top: 2px;">${timeStr}</div>`;
                        box.appendChild(div);
                    }
                });

                box.scrollTop = box.scrollHeight;
            });
        }

        document.getElementById('closeChatBtn').addEventListener('click', () => {
            if (messageListener && currentChatId) {
                db.ref('chats/' + currentChatId + '/messages').off('value', messageListener);
            }
            switchScreen('chatsScreen');
            loadUserChats();
        });

        const groupModal = document.getElementById('groupModal');
        document.getElementById('openGroupModalBtn').addEventListener('click', () => groupModal.style.display = 'flex');
        document.getElementById('closeGroupModalBtn').addEventListener('click', () => groupModal.style.display = 'none');
        
        document.getElementById('createGroupConfirmBtn').addEventListener('click', () => {
            const gName = document.getElementById('groupNameInput').value.trim();
            if (!gName) return;
            
            const gId = 'group_' + Date.now();
            db.ref('groups/' + gId).set({ name: gName, creator: myUsername });
            
            db.ref(`user_chats/${cleanKey(myUsername)}/${gId}`).set({ title: 'Группа: ' + gName, type: 'group', id: gId });

            groupModal.style.display = 'none';
            document.getElementById('groupNameInput').value = '';
            
            currentChatId = gId;
            document.getElementById('activeChatTitle').textContent = '👥 ' + gName;
            switchScreen('chatRoomScreen');
            loadMessages();
        });
    </script>
</body>
</html>
